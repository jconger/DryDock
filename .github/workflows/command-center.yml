name: Command Center Orchestration

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  orchestrate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (for templates)
        uses: actions/checkout@v4

      - name: Determine context
        id: ctx
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_PAT }}
          script: |
            const isIssueComment = !!context.payload.comment && !!context.payload.issue;
            const isPr = !!context.payload.pull_request;

            function bodyText() {
              if (isIssueComment) return context.payload.comment.body || "";
              if (isPr) return context.payload.pull_request.body || "";
              return "";
            }

            core.setOutput("is_issue_comment", String(isIssueComment));
            core.setOutput("is_pr_event", String(isPr));
            core.setOutput("comment_body", bodyText());

            const issue = isIssueComment ? context.payload.issue : null;
            const isPrComment = !!(issue && issue.pull_request);
            core.setOutput("is_pr_comment", String(isPrComment));

            if (isIssueComment) {
              core.setOutput("issue_number", String(issue.number));
              core.setOutput("repo_owner", context.repo.owner);
              core.setOutput("repo_name", context.repo.repo);
            }

      - name: Handle PR comment commands
        if: steps.ctx.outputs.is_issue_comment == 'true' && steps.ctx.outputs.is_pr_comment == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_PAT }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = Number(context.payload.issue.number);
            const body = (context.payload.comment.body || "").trim();

            const pr = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: issueNumber
            }).catch(async () => {
              throw new Error("Could not resolve PR from comment. Ensure this comment is on a PR.");
            });

            const prNumber = pr.data.number;
            const prUrl = pr.data.html_url;
            const prTitle = pr.data.title;
            const prLabels = pr.data.labels.map(l => l.name);

            const fs = require("fs");
            function stripJsonComments(raw) {
              return raw
                .replace(/\\/\\*[\\s\\S]*?\\*\\//g, "")
                .replace(/(^|\\s)\\/\\/.*$/gm, "");
            }
            function loadConfig() {
              try {
                const raw = fs.readFileSync(".command-center.jsonc", "utf8");
                return JSON.parse(stripJsonComments(raw));
              } catch (e) {
                return {};
              }
            }
            const config = loadConfig();
            const defaultCommentProtocol = {
              prefix: "/cc",
              commands: {
                qaGenerate: "/cc qa generate",
                qaPass: "/cc qa pass",
                qaFail: "/cc qa fail:",
                ralphRun: "/cc ralph run",
                ralphAccept: "/cc ralph accept:",
                finalCreate: "/cc final create"
              }
            };
            const commentProtocol = config.commentProtocol || {};
            const commentCommands = {
              ...defaultCommentProtocol.commands,
              ...(commentProtocol.commands || {})
            };
            const agentHarness = config.agentHarness || {};
            const provider = agentHarness.provider;
            const commandPrefix = agentHarness.commandPrefix
              || (provider === "codex" ? "/codex" : provider === "claude-code" ? "/claude" : "/opencode");
            const fixCommand = (agentHarness.commands && agentHarness.commands.fixRobust)
              || "fix robust: address QA failures from latest Fix Bundle comment. Update this PR. Add/adjust tests. Include root cause and verification steps.";
            const fixTrigger = `${commandPrefix} ${fixCommand}`;

            const CC_QA_GENERATE = commentCommands.qaGenerate;
            const CC_QA_PASS = commentCommands.qaPass;
            const CC_QA_FAIL_PREFIX = commentCommands.qaFail;
            const CC_RALPH_RUN = commentCommands.ralphRun;
            const CC_RALPH_ACCEPT_PREFIX = commentCommands.ralphAccept;
            const CC_FINAL_CREATE = commentCommands.finalCreate;

            function hasLabel(name) { return prLabels.includes(name); }

            async function addLabel(name) {
              await github.rest.issues.addLabels({ owner, repo, issue_number: prNumber, labels: [name] });
            }
            async function removeLabel(name) {
              await github.rest.issues.removeLabel({ owner, repo, issue_number: prNumber, name }).catch(() => {});
            }
            async function comment(msg) {
              await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body: msg });
            }

            function qaPacketStub() {
              return [
                `## QA Packet Requested`,
                ``,
                `I saw \`${CC_QA_GENERATE}\`.`,
                ``,
                `**PR:** ${prUrl}`,
                `**Title:** ${prTitle}`,
                ``,
                `### Next`,
                `- Generate QA checklist from the selected spec + PR diff (local app), then paste it as a comment.`,
                `- When done, run: \`${CC_QA_PASS}\` or \`${CC_QA_FAIL_PREFIX} <notes>\``,
              ].join("\n");
            }

            function ralphStub() {
              return [
                `## Ralph Pass Requested`,
                ``,
                `I saw \`${CC_RALPH_RUN}\`.`,
                ``,
                `**PR:** ${prUrl}`,
                ``,
                `### Next`,
                `- Generate naive-user “Ralph” findings (local app) and paste them here.`,
                `- If acceptable: \`${CC_RALPH_ACCEPT_PREFIX} <reason>\``,
                `- If not: trigger an agent fix via your configured harness (see below).`,
              ].join("\n");
            }

            if (body === CC_QA_GENERATE) {
              await addLabel("ai:ready-for-qa");
              await removeLabel("ai:qa-failed");
              await removeLabel("ai:qa-passed");
              await comment(qaPacketStub());
              return;
            }

            if (body.startsWith(CC_QA_FAIL_PREFIX)) {
              const notes = body.substring(CC_QA_FAIL_PREFIX.length).trim() || "(no notes provided)";
              await addLabel("ai:qa-failed");
              await removeLabel("ai:qa-passed");
              await comment([
                `## QA Failed`,
                ``,
                `**Notes:** ${notes}`,
                ``,
                `### Suggested next actions`,
                `1) Paste a Fix Bundle (local app) with repro + failed checks.`,
                `2) Trigger agent fix (configured harness) using the Fix Bundle:`,
                ``,
                `\`\`\``,
                `${fixTrigger}`,
                `\`\`\``,
              ].join("\n"));
              return;
            }

            if (body === CC_QA_PASS) {
              await addLabel("ai:qa-passed");
              await removeLabel("ai:qa-failed");
              await comment([
                `## QA Passed ✅`,
                ``,
                `If you want a clean PR, run: \`${CC_FINAL_CREATE}\``,
                `If you want to iterate more, keep this as the working PR.`,
              ].join("\n"));
              return;
            }

            if (body === CC_RALPH_RUN) {
              await comment(ralphStub());
              return;
            }

            if (body.startsWith(CC_RALPH_ACCEPT_PREFIX)) {
              const reason = body.substring(CC_RALPH_ACCEPT_PREFIX.length).trim() || "(no reason provided)";
              await removeLabel("ai:ralph-failed");
              await comment([
                `## Ralph Accepted`,
                ``,
                `**Reason:** ${reason}`,
                ``,
                `Ralph gate is now satisfied for final PR creation.`,
              ].join("\n"));
              return;
            }

            if (body === CC_FINAL_CREATE) {
              if (!hasLabel("ai:qa-passed")) {
                await addLabel("ai:blocked");
                await comment(`⚠️ Cannot create final PR: missing label \`ai:qa-passed\`. Run \`/cc qa pass\` first.`);
                return;
              }

              if (hasLabel("ai:ralph-failed")) {
                await addLabel("ai:blocked");
                await comment(`⚠️ Cannot create final PR: Ralph gate failed (\`ai:ralph-failed\`). Fix or accept Ralph issues.`);
                return;
              }

              const finalBranch = `final/pr-${prNumber}-${Date.now()}`;
              const base = pr.data.base.ref;
              const headRef = pr.data.head.ref;

              const baseRef = await github.rest.git.getRef({ owner, repo, ref: `heads/${base}` });
              const baseSha = baseRef.data.object.sha;

              await github.rest.git.createRef({
                owner, repo,
                ref: `refs/heads/${finalBranch}`,
                sha: baseSha
              });

              await github.rest.repos.merge({
                owner, repo,
                base: finalBranch,
                head: headRef,
                commit_message: `[FINAL] ${prTitle}`
              });

              const finalPr = await github.rest.pulls.create({
                owner, repo,
                title: `[FINAL] ${prTitle}`,
                head: finalBranch,
                base: base,
                body: [
                  `Supersedes working PR #${prNumber}.`,
                  ``,
                  `- Working PR: ${prUrl}`,
                  `- QA: passed (label ai:qa-passed)`,
                  ``,
                  `For a true squash/cherry-pick final PR, run the local CLI:`,
                  `\`pnpm --dir apps/command-center-ui cc final create --owner ${owner} --repo ${repo} --pr ${prNumber} --mode squash\``,
                ].join("\n")
              });

              await github.rest.issues.addLabels({
                owner, repo,
                issue_number: finalPr.data.number,
                labels: ["ai:final-pr", "ai:qa-passed"]
              });

              await comment(`✅ Final PR created: ${finalPr.data.html_url}`);
              return;
            }
            return;
